<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대일ON(溫) | 대일관광고등학교</title>
  <meta name="description"
        content="학교 업무를 하나로, 소통은 따뜻하게">
  <style>
    /* 대일ON 접속 페이지 */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Malgun Gothic", sans-serif;
      background: #edf3fa;
      color: #17365d;
      text-align: center;
    }
    .card {
      padding: 35px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 10px; font-size: 36px; }
    .on { color: #1673df; }
    p { color: #65758c; }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 25px;
      background: #1673df;
      color: white;
      border-radius: 9px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>대일<span class="on">ON</span>(溫)</h1>
    <p>학교 업무를 하나로, 소통은 따뜻하게</p>
    <p>대일관광고등학교 통합 업무 플랫폼</p>
    <p>학교업무대시보드로 이동합니다.</p>
    <a id="openApp" href="#">대일ON 접속하기</a>
  </div>
  <script>
    // 이곳에 대일ON 웹 앱의 배포 URL을 입력한다.
    // 기존 온라인 업무 소통방 URL과 혼동하지 않도록 주의한다.
    const APP_URL = "https://script.google.com/macros/s/AKfycbzbbM4aJyy0qb9w-3P6h2KgN_suW4oejUVkhA59LJJ_qGpfvSZshn3wbVI9PJqRGExQ/exec";

    // 수동 접속 버튼에도 동일한 주소를 지정한다.
    document.getElementById("openApp").href = APP_URL;

    // 페이지 접속 시 대일ON으로 자동 이동한다.
    // replace는 뒤로 가기 시 접속 페이지로 반복 복귀하는 것을 줄인다.
    if (APP_URL.startsWith("https://script.google.com/macros/s/")) {
      window.location.replace(APP_URL);
    }
  </script>
</body>
</html>
